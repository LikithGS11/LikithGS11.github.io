<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Likith G S — AI/ML Engineer, Computer Vision Engineer, LLM Developer">
  <style>
    /* README banner (dark theme). Transparent background so it sits on GitHub's page.
       The name rises in once; the role line cycles like the site's hero. */
    .name  { font: 600 92px/1 -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -2px; fill: #e6edf3; }
    .role  { font: 400 34px/1 -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .link  { font: 400 20px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .rule  { stroke: #f2a46b; stroke-width: 3; stroke-linecap: round; }

    .name { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) .1s forwards; }
    .rule { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .8s cubic-bezier(.22,1,.36,1) .6s forwards; }
    .link { opacity: 0; animation: fade .8s ease 1.2s forwards; }
    .r { opacity: 0; animation: cycle 9s cubic-bezier(.25,.1,.25,1) infinite; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }

    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes fade  { to { opacity: 1; } }
    /* each role: slide up into place, hold, slide up and out (one third of the loop each) */
    @keyframes cycle {
      0%      { opacity: 0; transform: translateY(12px); }
      4%      { opacity: 1; transform: none; }
      29%     { opacity: 1; transform: none; }
      33%     { opacity: 0; transform: translateY(-12px); }
      100%    { opacity: 0; transform: translateY(-12px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .name, .link, .r1 { animation: none; opacity: 1; }
      .rule { animation: none; stroke-dashoffset: 0; }
      .r2, .r3 { animation: none; opacity: 0; }
    }
  </style>
  <text class="name" x="60" y="140">Likith G S</text>
  <line class="rule" x1="62" y1="172" x2="182" y2="172"/>
  <g>
    <text class="role r r1" x="60" y="226">AI/ML Engineer</text>
    <text class="role r r2" x="60" y="226">Computer Vision Engineer</text>
    <text class="role r r3" x="60" y="226">LLM Developer</text>
  </g>
  <text class="link" x="60" y="276">likithgs11.github.io/Portfolio ↗</text>
</svg>
